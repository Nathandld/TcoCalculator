# Dependabot: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # NuGet packages of every project (flat layout at the root + tests/).
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/TcoCalculator.*"
      - "/tests/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"

  # Versions of the actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"

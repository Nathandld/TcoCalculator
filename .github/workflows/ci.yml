name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build & Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore tests/TcoCalculator.Tests/TcoCalculator.Tests.csproj

      - name: Build
        run: dotnet build tests/TcoCalculator.Tests/TcoCalculator.Tests.csproj --no-restore -c Release

      - name: Tests xUnit
        run: >
          dotnet test tests/TcoCalculator.Tests/TcoCalculator.Tests.csproj
          --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet : Sonar en a besoin pour identifier le « nouveau code »

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-java@v4   # le scanner Sonar tourne sur Java
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurer les outils .NET
        run: dotnet tool restore

      - name: Début de l'analyse
        run: >
          dotnet sonarscanner begin
          /k:"Nathandld_TcoCalculator"
          /o:"nathandld"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/Migrations/**"
          /d:sonar.coverage.exclusions="**/TcoDbContextFactory.cs"

      - name: Build
        run: dotnet build tests/TcoCalculator.Tests/TcoCalculator.Tests.csproj -c Release

      - name: Tests avec couverture
        run: >
          dotnet test tests/TcoCalculator.Tests/TcoCalculator.Tests.csproj
          --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Fin de l'analyse et envoi à SonarCloud
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  build-ui:
    name: Build UI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Installer le workload MAUI (Windows uniquement)
        run: dotnet workload install maui-windows

      - name: Build de toute la solution
        run: dotnet build TcoCalculator.sln -c Release

  migrations:
    name: EF Core migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurer les outils .NET
        run: dotnet tool restore

      - name: Vérifier qu'aucune migration n'a été oubliée
        run: >
          dotnet ef migrations has-pending-model-changes
          --project TcoCalculator.Data
          --startup-project TcoCalculator.Data

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build & Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore tests/TcoCalculator.Tests/TcoCalculator.Tests.csproj

      - name: Build
        run: dotnet build tests/TcoCalculator.Tests/TcoCalculator.Tests.csproj --no-restore -c Release

      - name: Tests xUnit
        run: >
          dotnet test tests/TcoCalculator.Tests/TcoCalculator.Tests.csproj
          --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml